{% extends "base.html" %}

{% block title %}Resume Builder | CareerBridge{% endblock %}

{% block content %}

<section>
    <h1>Resume Builder 📄</h1>
    <p>Enter your details to create a professional resume.</p>

    <div class="card">
        <form id="resumeForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="Enter your full name">

            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="Enter your email">

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">

            <label for="education">Education</label>
            <textarea id="education" required placeholder="Your degree, college and graduation year"></textarea>

            <label for="skills">Skills</label>
            <textarea id="skills" required placeholder="Python, HTML, CSS, SQL..."></textarea>

            <label for="experience">Projects / Experience</label>
            <textarea id="experience" placeholder="Describe your projects or experience"></textarea>

            <button type="submit" class="button">
                Generate Resume
            </button>

        </form>
    </div>

    <div id="resumeOutput" class="card" style="display:none; margin-top:25px;">
        <h2 id="outputName"></h2>
        <p id="outputContact"></p>

        <h3>Education</h3>
        <p id="outputEducation"></p>

        <h3>Skills</h3>
        <p id="outputSkills"></p>

        <h3>Projects / Experience</h3>
        <p id="outputExperience"></p>

        <button onclick="window.print()" class="button">
            Print / Save as PDF
        </button>
    </div>
</section>

<style>
    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font: inherit;
    }

    textarea {
        min-height: 80px;
        resize: vertical;
    }

    button {
        border: none;
        cursor: pointer;
        margin-top: 20px;
        font: inherit;
    }

    @media print {

        header,
        footer,
        form,
        #resumeOutput button {
            display: none !important;
        }

        #resumeOutput {
            display: block !important;
            box-shadow: none;
        }

        body {
            background: white;
        }
    }
</style>

<script>
    document.getElementById("resumeForm").addEventListener("submit", function (event) {
        event.preventDefault();

        document.getElementById("outputName").textContent =
            document.getElementById("name").value;

        document.getElementById("outputContact").textContent =
            document.getElementById("email").value + " | " +
            document.getElementById("phone").value;

        document.getElementById("outputEducation").textContent =
            document.getElementById("education").value;

        document.getElementById("outputSkills").textContent =
            document.getElementById("skills").value;

        document.getElementById("outputExperience").textContent =
            document.getElementById("experience").value || "Not provided";

        document.getElementById("resumeOutput").style.display = "block";
    });
</script>

{% endblock %}
