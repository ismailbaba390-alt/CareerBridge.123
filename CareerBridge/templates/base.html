<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CareerBridge | Build Your Future{% endblock %}</title>

    <style>
        :root {
            --bg: #080b18;
            --surface: #11162b;
            --text: #f8fafc;
            --muted: #c0c9df;
            --cyan: #22d3ee;
            --purple: #a78bfa;
            --pink: #f472b6;
            --border: rgba(255, 255, 255, 0.13);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;

            background:
                radial-gradient(ellipse at 10% 0%, #27205b 0%, transparent 38%),
                radial-gradient(ellipse at 90% 15%, #123d59 0%, transparent 35%),
                var(--bg);

            background-size: 150% 150%;
            animation: backgroundFlow 15s ease infinite;
        }

        @keyframes backgroundFlow {

            0%,
            100% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 100%;
            }
        }

        /* NAVBAR */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 18px 6%;

            background: rgba(8, 11, 24, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-bottom: 1px solid var(--border);
            animation: navbarDrop 0.7s ease both;
        }

        @keyframes navbarDrop {
            from {
                opacity: 0;
                transform: translateY(-25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .navbar {
            max-width: 1400px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            text-decoration: none;
            color: white;

            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .brand span {
            background: linear-gradient(90deg,
                    var(--cyan),
                    var(--purple),
                    var(--pink));

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.6));
        }

        nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
        }

        nav a {
            position: relative;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;

            padding: 10px 13px;
            border-radius: 10px;

            transition: all 0.3s ease;
        }

        nav a::after {
            content: "";
            position: absolute;
            bottom: 4px;
            left: 50%;

            width: 0;
            height: 2px;

            background: linear-gradient(90deg, var(--cyan), var(--pink));
            transform: translateX(-50%);
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: white;
            background: rgba(167, 139, 250, 0.14);
            transform: translateY(-2px);
        }

        nav a:hover::after {
            width: 65%;
        }

        /* MAIN PAGE */

        main {
            width: 92%;
            max-width: 1250px;
            min-height: 68vh;
            margin: 45px auto;

            animation: pageEnter 0.7s ease both;
        }

        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateY(22px);
                filter: blur(3px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* TEXT VISIBILITY FIX */

        main h1,
        main h2,
        main h3,
        main h4 {
            color: #f8fafc;
            line-height: 1.3;
        }

        main p,
        main li {
            color: #d4dcef;
        }

        main strong,
        main b {
            color: #ffffff;
        }

        main a:not(.button):not(.card) {
            color: var(--cyan);
        }

        main a:not(.button):not(.card):hover {
            color: var(--pink);
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit,
                    minmax(230px, 1fr));

            gap: 24px;
            margin-top: 30px;
        }

        .card {
            position: relative;
            isolation: isolate;

            display: block;
            overflow: hidden;

            padding: 28px;

            background: linear-gradient(145deg,
                    #18203c,
                    #11162b,
                    #171633);

            border: 1px solid rgba(129, 140, 248, 0.25);
            border-radius: 20px;

            color: #f8fafc;
            text-decoration: none;

            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);

            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;

            animation: cardEnter 0.7s ease both;
        }

        .card:nth-child(2) {
            animation-delay: 0.08s;
        }

        .card:nth-child(3) {
            animation-delay: 0.16s;
        }

        .card:nth-child(4) {
            animation-delay: 0.24s;
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card::before {
            content: "";
            position: absolute;
            z-index: -1;
            top: 0;
            left: -120%;

            width: 100%;
            height: 3px;

            background: linear-gradient(90deg,
                    var(--cyan),
                    var(--purple),
                    var(--pink));

            transition: left 0.5s ease;
        }

        .card:hover {
            transform: translateY(-9px) scale(1.015);

            border-color: rgba(167, 139, 250, 0.65);

            box-shadow:
                0 20px 45px rgba(91, 65, 190, 0.22),
                0 0 20px rgba(34, 211, 238, 0.08);
        }

        .card:hover::before {
            left: 0;
        }

        .card h2,
        .card h3,
        .card h4 {
            color: var(--cyan);
            margin-bottom: 12px;
        }

        .card p,
        .card li {
            color: #d4dcef;
        }

        .card a {
            color: #67e8f9;
        }

        /* COLLEGE FINDER */

        .college-card,
        .college-item,
        .college-result,
        .college-box {
            background: linear-gradient(145deg,
                    #18203c,
                    #11162b);

            color: #f8fafc;
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 16px;
        }

        .college-card h1,
        .college-card h2,
        .college-card h3,
        .college-item h1,
        .college-item h2,
        .college-item h3,
        .college-result h1,
        .college-result h2,
        .college-result h3 {
            color: #67e8f9;
        }

        .college-card p,
        .college-item p,
        .college-result p {
            color: #dbeafe;
        }

        /* INPUTS AND SEARCH BOXES */

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 15px;
            margin: 8px 0 16px;

            background: #ffffff;
            color: #172033;

            border: 1px solid #94a3b8;
            border-radius: 10px;
            outline: none;

            font: inherit;

            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: #64748b;
            opacity: 1;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #06b6d4;

            box-shadow:
                0 0 0 3px rgba(34, 211, 238, 0.15),
                0 0 15px rgba(34, 211, 238, 0.08);

            transform: translateY(-2px);
        }

        select option {
            background: #ffffff;
            color: #172033;
        }

        label {
            display: inline-block;
            color: #e0e7ff;
            font-weight: 600;
        }

        /* BUTTONS */

        .button,
        button {
            position: relative;
            overflow: hidden;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 13px 23px;

            background: linear-gradient(100deg,
                    #06b6d4,
                    #7c3aed,
                    #a855f7);

            background-size: 200% 200%;

            color: #ffffff;
            border: none;
            border-radius: 12px;

            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;

            cursor: pointer;

            box-shadow: 0 7px 24px rgba(124, 58, 237, 0.25);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .button::before,
        button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -130%;

            width: 70%;
            height: 100%;

            background: linear-gradient(110deg,
                    transparent,
                    rgba(255, 255, 255, 0.35),
                    transparent);

            transform: skewX(-20deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .button:hover,
        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(6, 182, 212, 0.25),
                0 0 15px rgba(124, 58, 237, 0.15);
        }

        .button:hover::before,
        button:hover::before {
            left: 150%;
        }

        /* TABLES */

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;

            background: rgba(17, 22, 43, 0.95);
            color: #f8fafc;

            border-radius: 12px;
            overflow: hidden;
        }

        th {
            padding: 14px;
            text-align: left;

            background: #312e81;
            color: #ffffff;
        }

        td {
            padding: 13px 14px;
            color: #dbeafe;
            border-bottom: 1px solid var(--border);
        }

        tr:hover td {
            background: rgba(124, 58, 237, 0.1);
        }

        /* FOOTER */

        footer {
            position: relative;
            overflow: hidden;

            margin-top: 70px;
            padding: 28px 20px;

            text-align: center;

            background: rgba(8, 11, 24, 0.9);
            border-top: 1px solid var(--border);

            color: #c0c9df;
        }

        footer p {
            margin: 0;
            color: #c0c9df;
        }

        footer span {
            color: var(--cyan);
            font-weight: 800;
        }

        footer::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;

            width: 100%;
            height: 2px;

            background: linear-gradient(90deg,
                    var(--cyan),
                    var(--purple),
                    var(--pink));

            animation: footerGlow 5s linear infinite;
        }

        @keyframes footerGlow {
            to {
                left: 100%;
            }
        }

        /* SCROLLBAR */

        ::-webkit-scrollbar {
            width: 9px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--purple),
                    var(--cyan));

            border-radius: 10px;
        }

        /* RESPONSIVE DESIGN */

        @media (max-width: 800px) {
            header {
                padding: 16px 5%;
            }

            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            nav {
                gap: 4px;
            }

            nav a {
                padding: 8px 10px;
                font-size: 13px;
            }

            main {
                width: 92%;
                margin: 30px auto;
            }

            .card {
                padding: 23px;
            }

            table {
                display: block;
                overflow-x: auto;
            }
        }

        /* ACCESSIBILITY */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="navbar">

            <a href="/" class="brand">
                Career<span>Bridge</span>
            </a>

            <nav>
                <a href="/">Home</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/skills">Skills</a>
                <a href="/resume">Resume Builder</a>
                <a href="/interview">Interview Prep</a>
                <a href="/opportunities">Opportunities</a>
                <a href="/colleges">College Finder</a>
            </nav>

        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p><span>CareerBridge</span> | Your Career, Your Future 🚀</p>
    </footer>

</body>

</html>
